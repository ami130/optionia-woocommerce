name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Runs first and independently: a leaked credential must fail the build even
  # if every other check would pass.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/check-secrets.sh

  # A script pointing at a file that does not exist makes a working repository
  # look broken to anyone who clones it.
  scripts:
    name: Script integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash bin/check-scripts.sh

  verify:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 24 is what
        # development runs on. Testing one and shipping the other makes the
        # unsupported version an untested claim.
        node: ['20', '24']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: optionia_woo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # Migrations must run forward AND back. An irreversible migration is a
      # production incident waiting for a bad deploy.
      - name: Migrations up and down
        run: |
          npm run migration:run
          npm run migration:revert
          npm run migration:run
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: optionia_woo_test
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_SSL: false
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
          CORS_ORIGINS: http://localhost:3000

      - run: npm run test
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: optionia_woo_test
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_SSL: false
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
          CORS_ORIGINS: http://localhost:3000

      # A dependency with a known advisory ships silently otherwise. Caught
      # once by hand — nodemailer 7 had six advisories including CRLF header
      # injection, which matters directly for a mailer that puts user-supplied
      # names into headers. Nothing would have said so.
      #
      # --omit=dev because a devDependency advisory does not reach production
      # and would block CI on something only a developer can reach.
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high

      # docs/DATABASE.md has drifted from the schema twice. Both times a person
      # found it by reading, which is the slowest detector available.
      - name: Documentation matches schema
        run: bash bin/check-docs.sh
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: optionia_woo_test
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_SSL: false
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
          CORS_ORIGINS: http://localhost:3000

      # The contract is consumed by a plugin that cannot be redeployed across
      # merchant sites, so drift is more expensive here than elsewhere.
      - name: API contract matches the routes
        run: bash bin/check-api-contract.sh
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: optionia_woo_test
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_SSL: false
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
          CORS_ORIGINS: http://localhost:3000

      # Seeds must be idempotent and must refuse production. Both were
      # previously verified by hand, once — so a regression would have passed CI
      # and been found by a developer discovering six plans.
      - name: Seed the database
        run: |
          npm run db:seed
          npm run db:seed:demo
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: optionia_woo_test
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_SSL: false
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
          CORS_ORIGINS: http://localhost:3000

      # Schema constraints live in MySQL and no unit test can observe them.
      # A delete rule regressing to RESTRICT would make GDPR user erasure
      # impossible, and migration:run would still pass.
      # Coverage, not just pass/fail. The unit report shows the security code at
      # 0% because it has no unit tests by design (ADR-023), so this is the only
      # place the real figure is visible.
      - name: Schema and seed guarantees
        run: npm run test:e2e:cov
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: optionia_woo_test
          DB_USER: root
          DB_PASSWORD: ci_root_password
          DB_SSL: false
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
          CORS_ORIGINS: http://localhost:3000
