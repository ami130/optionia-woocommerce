name: Cross-repo gates

# The cross-repository gates, on every push. There are 35 today; `bin/check.sh`
# discovers them, so this comment does not need updating when one is added.
#
# ✅ **Live since 2026-09-22.** This ran nothing for its first day: the four
# repositories had no remote, and the job tried to check out three sub-repos
# that did not exist. Both are fixed — the three were merged into this
# repository with their full histories (265 commits), so the single checkout
# below has everything the gates read.
#
# 📌 **The gates are also enforced locally** by `bin/pre-commit.sh`, installed
# with `bash bin/install-hooks.sh`. CI is the backstop, not the only guard.

on:
  # 📌 **Manually runnable.** A path filter means a workflow can sit on a stale
  # result for commits that did not touch it — three of these showed failures
  # from two commits earlier, which reads as broken rather than skipped.
  workflow_dispatch:

  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    name: cross-repo gates
    runs-on: ubuntu-latest

    # ✏️ **Added after the first real run of this job failed.** Four gates load
    # the backend's configuration and query a schema — `check:api`,
    # `check:isolation`, `check:openapi` and the DATABASE.md check. They had
    # been skipping for want of `node_modules/`, so nobody had learned they also
    # need `JWT_SECRET` and a database. Reproduced locally by moving `.env`
    # aside: `ConfigurationError: Missing required environment variable:
    # JWT_SECRET`. With these values and no `.env` at all, the docs check passes
    # — 37 tables, 44 foreign keys.
    #
    # 📌 **The same service block `backend.yml` uses**, deliberately duplicated
    # rather than shared: a composite action would couple two workflows whose
    # reasons for needing a database are unrelated, and the duplication is six
    # lines that fail loudly when wrong.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: optionia_woo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # ⚠️ **Job-level, so every step sees them.** `bin/check.sh` shells out to
    # several project scripts, and an env block on the gate step alone would not
    # reach the ones that re-enter through `npm run`.
    env:
      NODE_ENV: test
      PORT: 4000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: optionia_woo_test
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_SSL: false
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-min-32-chars
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out the parent
        uses: actions/checkout@v4


      # ✏️ **This used to say "No Node, no PHP, no Composer", verified
      # 2026-09-22.** It was true then and false by M26e: the job passed in ~20
      # seconds while SKIPPING seven real checks — both projects' lint,
      # DATABASE.md, and four backend gates — because each skips when its
      # `node_modules/` is absent. A green tick for checks that never ran is
      # worse than a red one, and it had been green that way for weeks.
      #
      # 🔴 **So the toolchain is installed and the gates actually run.** The job
      # is slower than 20 seconds; that was the price of the result meaning
      # something. `bin/check.sh` still refuses to start without shell, awk, sed,
      # grep and python3 (F51), so a missing interpreter fails by name.
      # 📌 **24, matching `backend.yml`.** The backend is the project whose
      # build and typecheck these gates invoke, so its runtime is the one that
      # has to agree. A bare '22' was tried first and rejected: a transitive
      # dependency in this tree declares `>=20.19 <22 || >=22.12`, which a
      # major-only selector can resolve inside the excluded range.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ⚠️ **`npm ci` everywhere except the dashboard**, which uses `npm install`
      # for the reason `dashboard.yml` records at length: `@emnapi/*` are
      # Linux-only optional dependencies of `@img/sharp-wasm32`, a macOS-written
      # lockfile never resolves that branch, and `npm ci` refuses with EUSAGE.
      # Regenerating the lockfile was tried and made it worse. Matching that
      # workflow rather than inventing a variant — a `npm ci || npm install`
      # fallback here would attempt a command known to always fail.
      - name: Backend dependencies
        run: npm ci
        working-directory: optioniaWooCommerceBackend

      - name: Dashboard dependencies
        run: npm install
        working-directory: optioniaWooCommerceFrontend

      - name: Plugin JavaScript dependencies
        run: npm ci
        working-directory: optioniaWooCommercePlugin

      # ✏️ **The first version of this step list installed Node and stopped**,
      # which fixed the JavaScript half of the very problem this job exists to
      # solve and left the PHP half exactly as it was: `check-plugin-tests.sh`
      # skips when `vendor/` is absent, so 1974 plugin tests reported success in
      # CI having never run.
      #
      # 📌 **8.4, matching `plugin.yml`** — the only version the test tooling
      # resolves on, since PHPUnit 9.6's dependencies now require PHP 8. The
      # 7.4 floor the plugin header promises is parsed by that workflow's own
      # `floor` job and is not this job's business.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Dev dependencies included, unlike the `floor` job: PHPUnit is the point.
      - name: Plugin PHP dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: optioniaWooCommercePlugin

      - name: All cross-repo gates
        run: bash bin/check.sh
