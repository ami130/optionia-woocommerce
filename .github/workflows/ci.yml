name: Cross-repo gates

# The 17 cross-repository gates, on every push.
#
# ✅ **Live since 2026-09-22.** This ran nothing for its first day: the four
# repositories had no remote, and the job tried to check out three sub-repos
# that did not exist. Both are fixed — the three were merged into this
# repository with their full histories (265 commits), so the single checkout
# below has everything the gates read.
#
# 📌 **The gates are also enforced locally** by `bin/pre-commit.sh`, installed
# with `bash bin/install-hooks.sh`. CI is the backstop, not the only guard.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gates:
    name: 17 cross-repo gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out the parent
        uses: actions/checkout@v4


      # 📌 **No Node, no PHP, no Composer.** Verified 2026-09-22 by running the
      # suite under `env -i` with only /usr/bin and /bin on PATH: all 17 gates
      # passed. They need shell, awk, sed, grep and python3.
      #
      # ⚠️ **That list is enforced, not assumed.** `bin/check.sh` refuses to run
      # if any of the four is missing (F51) — so this job fails with a named
      # interpreter rather than with a gate failing for the wrong reason. Adding
      # setup steps "just in case" would hide the day one grows a real dependency.
      - name: All cross-repo gates
        run: bash bin/check.sh
