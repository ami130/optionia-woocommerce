name: Dashboard

# The dashboard was the one repository of the three with tests and no pipeline:
# 21 files and 463 assertions that ran only when somebody remembered. Recorded as
# F1 in the plan's STATUS block on 2026-09-02, marked "fix now", and still open
# three phases later — which is precisely how a regression enters unnoticed while
# attention is elsewhere.
# ✏️ **Moved to the repository root 2026-09-22.** It lived at
# `optioniaWooCommerceFrontend/.github/workflows/ci.yml` until the three repositories were merged into
# one — where GitHub never reads it, because only `/.github` at the root is
# honoured. Three workflows that looked like CI and ran nothing.
#
# 📌 **Unchanged apart from three things**: the name (so three can coexist), a
# path filter (so a plugin change does not rebuild the backend), and
# `working-directory` (so every `run:` still executes where it used to).

on:
  # 📌 **Manually runnable.** A path filter means a workflow can sit on a stale
  # result for commits that did not touch it — three of these showed failures
  # from two commits earlier, which reads as broken rather than skipped.
  workflow_dispatch:

  push:
    branches: [main, develop]
    paths: ['optioniaWooCommerceFrontend/**', '.github/workflows/dashboard.yml']
  pull_request:
    branches: [main, develop]
    paths: ['optioniaWooCommerceFrontend/**', '.github/workflows/dashboard.yml']

defaults:
  run:
    working-directory: optioniaWooCommerceFrontend

jobs:
  verify:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Mirrors the backend: 20 is the supported floor, 24 is what development
        # runs on. Testing one and shipping the other makes the other an
        # untested claim.
        node: ['20', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # ⚠️ **`working-directory` does not reach a `uses:` step.** The
          # cache action resolves its lockfile from the repository root, which
          # no longer holds one — so the path is given explicitly.
          cache-dependency-path: optioniaWooCommerceFrontend/package-lock.json

      # 🔴 **`npm install`, not `npm ci`, and the reason is platform-specific.**
      #
      # `@emnapi/runtime` and `@emnapi/core` are Linux-only optional
      # dependencies of `@img/sharp-wasm32` and `@tailwindcss/oxide-wasm32-wasi`.
      # A lockfile generated on macOS never resolves that branch, so `npm ci`
      # refuses with EUSAGE — *"Missing: @emnapi/runtime from lock file"* — while
      # the same lockfile installs perfectly on the machine that wrote it.
      #
      # ⚠️ **Regenerating the lockfile does not fix it.** Tried with
      # `--package-lock-only`, `--include=optional` and `--force`: npm cannot
      # resolve a Linux-only optional tree from macOS, and `--force` produced a
      # lockfile that broke on *both* platforms.
      #
      # `npm install` resolves the tree on the runner. It gives up `ci`'s
      # guarantee that the lockfile is authoritative — a real cost, recorded
      # here rather than hidden — in exchange for a build that runs at all.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # --omit=dev because a devDependency advisory does not reach a merchant's
      # browser and would block CI on something only a developer can reach.
      # This dashboard renders merchant-authored option config, so a high
      # advisory in a runtime dependency is a real exposure rather than hygiene.
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high
